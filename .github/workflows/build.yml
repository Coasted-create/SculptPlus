name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - name: Test
        run: dotnet run --project tests -c Release
      - name: Build
        run: dotnet build SculptPlus.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: SculptPlus
          path: |
            bin/Release/SculptPlus.dll
            bin/Release/SculptPlus.json
